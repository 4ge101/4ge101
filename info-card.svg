<svg xmlns="http://www.w3.org/2000/svg" width="490" height="270" viewBox="0 0 490 270">
<style>
  text { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 15px; }
  .k { fill: #39d353; font-weight: bold; }
  .v { fill: #c9d1d9; }
  .t { fill: #8b949e; font-size: 13px; }
  .l { opacity: 0; animation: in 0.5s ease forwards; }
  @keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
</style>
<rect width="490" height="270" rx="10" fill="#0d1117" stroke="#30363d"/>
<rect width="490" height="36" rx="10" fill="#161b22"/>
<circle cx="20" cy="18" r="6" fill="#ff5f56"/>
<circle cx="40" cy="18" r="6" fill="#ffbd2e"/>
<circle cx="60" cy="18" r="6" fill="#27c93f"/>
<text x="80" y="23" class="t">yourname@github ~ $ neofetch</text>
<g class="l" style="animation-delay:0.4s"><text x="24" y="70" class="k">Name</text><text x="110" y="70" class="v">Your Name</text></g>
<g class="l" style="animation-delay:0.75s"><text x="24" y="104" class="k">Now</text><text x="110" y="104" class="v">What you do or study now</text></g>
<g class="l" style="animation-delay:1.1s"><text x="24" y="138" class="k">Prev</text><text x="110" y="138" class="v">Past work or projects</text></g>
<g class="l" style="animation-delay:1.4499999999999997s"><text x="24" y="172" class="k">Stack</text><text x="110" y="172" class="v">Python, JavaScript, Git</text></g>
<g class="l" style="animation-delay:1.7999999999999998s"><text x="24" y="206" class="k">Goal</text><text x="110" y="206" class="v">What you want to build</text></g>
</svg>